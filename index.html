<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f4a">
  <title>Bill Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="shopTitle">Bill Book</h1>
    <div class="today">Today's total <strong id="todayTotal">0.00</strong></div>
  </header>

  <nav id="tabs">
    <button data-tab="new" class="on">New bill</button>
    <button data-tab="history">History</button>
    <button data-tab="items">Items</button>
    <button data-tab="shop">Shop</button>
  </nav>

  <main>
    <section id="new">
      <h2>Pick items and quantity</h2>
      <div id="rows"></div>
      <div class="card grid3">
        <label>Discount <input id="discValue" type="number" min="0" step="any" inputmode="decimal" value="0"></label>
        <label>Discount type
          <select id="discType"><option value="amt">Rupees</option><option value="pct">Percent</option></select>
        </label>
        <label>Tax % <input id="taxPct" type="number" min="0" step="any" inputmode="decimal"></label>
      </div>
      <dl class="card totals" id="summary"></dl>
      <div class="actions">
        <button class="primary" id="saveBill">Save bill and show QR</button>
        <button id="clearBill">Clear bill</button>
      </div>
    </section>

    <section id="history" hidden>
      <div class="card big">Today's total: <strong id="todayTotal2">0.00</strong></div>
      <h2>All bills</h2>
      <div id="billList"></div>
    </section>

    <section id="items" hidden>
      <h2 id="itemFormTitle">Add an item</h2>
      <form id="itemForm" class="card">
        <label>Item name <input id="itemName" required maxlength="40"></label>
        <label>Price in rupees <input id="itemPrice" required type="number" min="0" step="0.01" inputmode="decimal"></label>
        <div class="actions">
          <button class="primary" id="itemSave">Add item</button>
          <button type="button" id="itemCancel" hidden>Cancel edit</button>
        </div>
      </form>
      <h2>Your items</h2>
      <div id="itemList"></div>
    </section>

    <section id="shop" hidden>
      <h2>Shop profile</h2>
      <form id="shopForm" class="card">
        <label>Shop name <input id="shopName" required maxlength="40"></label>
        <label>Address <input id="shopAddr" maxlength="80"></label>
        <label>Phone <input id="shopPhone" type="tel" maxlength="20"></label>
        <label>Your UPI ID (for the QR code) <input id="shopUpi" placeholder="name@bank" autocapitalize="none"></label>
        <label>Default tax % <input id="shopTax" type="number" min="0" step="any" inputmode="decimal"></label>
        <div class="actions"><button class="primary">Save shop profile</button></div>
        <p id="shopMsg" class="msg"></p>
      </form>
    </section>
  </main>

  <dialog id="billDialog">
    <canvas id="billCanvas"></canvas>
    <p id="qrNote" class="msg"></p>
    <div class="actions">
      <button class="primary" id="shareBtn">Share bill as image</button>
      <button id="downloadBtn">Download image</button>
      <button id="closeBtn">Close</button>
    </div>
  </dialog>

  <script src="qrcode.js"></script>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
